[package]
name = "dotcore"
version = "0.1.0"
edition = "2024"
description = "Core library of dotboard. Implementations of core engines and shared data structures"

[dependencies]
tokio = { version = "1.52.3", features = ["full"] }
tokio-util = { version = "0.7.18", features = ["codec"] }
rkyv = { version = "0.8.16", features = ["bytecheck", "unaligned"] }
futures = "0.3.32"
bytes = "1.12.0"
num_enum = "0.7.6"
